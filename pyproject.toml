
[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multisource-data-agent"
version = "0.1.2"
description = "LangGraph-based multi-source Enterprise Data Agent with synthetic retail demos"
readme = "README.md"
requires-python = ">=3.10,<3.13"

# SPDX license metadata
license = "Apache-2.0"
license-files = ["LICENSE"]

# Main backend runtime dependencies
dependencies = [
    "fastapi>=0.110.0,<1",
    "uvicorn[standard]>=0.27.0,<1",
    "pydantic==2.10.4",
    "pydantic-settings==2.4.0",
    "email-validator>=2.0.0",
    "aiofiles",

    "openai>=1.58.1,<2",
    "langchain==0.3.7",
    "langchain-community==0.3.4",
    "langchain-openai==0.2.14",
    "langchain-neo4j==0.3.0",
    "langchain-core>=0.3.39,<0.4.0",
    "langchain-text-splitters>=0.3.0,<0.4.0",
    "langgraph==0.2.60",
    "langgraph-checkpoint==2.0.8",

    "numpy>=1.24,<2.0",
    "scikit-learn==1.4.2",

    "sqlalchemy==2.0.25",
    "pymysql==1.1.0",
    "sqlglot==30.18.0",
    "neo4j==5.27.0",

    "httpx==0.26.0",
    "requests==2.31.0",
    "aiohttp>=3.9,<4",

    "bcrypt==4.1.2",
    "python-jose[cryptography]>=3.3,<4",
    "regex>=2023.12.25",
    "typing-extensions>=4.9,<5",

    "python-dotenv>=1.0.0,<2.0.0",
    "python-multipart>=0.0.31,<1",
    "pyyaml==6.0.1",
    "jinja2==3.1.3",
    "loguru==0.7.2",
]

[project.optional-dependencies]
# Development and testing
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "pytest-cov==4.1.0",
    "black>=24.1,<25",
    "mypy>=1.8,<2",
]

# PostgreSQL / PGVector knowledge ingestion service
kb-ingest = [
    "pandas>=2.1.0,<3",
    "openpyxl>=3.1.2,<4",
    "psycopg2-binary>=2.9.9,<3",
    "pgvector>=0.2.5,<1",
]

# Linux deployment option
deploy = [
    "gunicorn>=21.2,<24",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.setuptools.packages.find]
where = ["."]
