name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      DEBUG: "false"
      MULTISOURCE_AGENT_DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install from canonical dependency declarations
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Deterministic tests (no external LLM or databases)
        run: python -m pytest -q
      - name: Build and inspect backend wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" .
          python scripts/check_wheel.py "$RUNNER_TEMP"/wheels/multisource_data_agent-*.whl
          python -m pip install --force-reinstall --no-deps "$RUNNER_TEMP"/wheels/multisource_data_agent-*.whl
      - name: Import installed application outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -I -c "from importlib.metadata import version; from multisource_data_agent.main import application; assert application.version == version('multisource-data-agent'); print(application.title, application.version)"
          python -m pip check
      - name: Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env.example config --quiet

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
